name: Inspect carousel
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print interaction code
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for m in re.finditer(r'<script[^>]*>(.*?)</script>', s, re.S|re.I):
              body=m.group(1)
              if any(x in body for x in ['pointerdown','pointermove','pointerup','touchstart','touchmove','touchend','requestAnimationFrame','rotateY']):
                  print('---SCRIPT---')
                  print(body[:50000])
          print('---CSS/HTML BARREL CONTEXT---')
          for m in re.finditer(r'.{0,500}(?:barrel|rotateY).{0,1200}', s, re.I|re.S): print(m.group(0))
