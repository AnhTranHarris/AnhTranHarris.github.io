name: Rebuild carousel controller
on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - '.github/workflows/inspect-carousel.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy controller and load isolated controller
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<script>\s*\(\(\) => \{.*?</script>', '<script src="carousel-touch.js"></script>', s, count=1, flags=re.S)
          s = s.replace('touch-action:pan-y;overscroll-behavior-x:none;', 'touch-action:none;overscroll-behavior-x:none;')
          s = s.replace('touch-action:pan-y}.page', 'touch-action:none}.page')
          p.write_text(s, encoding='utf-8')
      - name: Verify rebuild
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert 'carousel-touch.js' in s
          assert 'touch-action:none' in s
          assert '<script>\n(() => {' not in s
      - name: Commit rebuild
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Rebuild carousel as isolated card interaction' || exit 0
          git push
      - name: Remove temporary workflows
        if: success()
        run: |
          rm -f .github/workflows/inspect-carousel.yml .github/workflows/install-carousel-controller.yml
          git add -A .github/workflows
          git commit -m 'Remove temporary carousel rebuild workflows' || exit 0
          git push
