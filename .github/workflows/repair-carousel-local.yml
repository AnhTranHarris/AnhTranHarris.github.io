name: Repair local carousel gesture

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Apply local carousel gesture rebuild') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate gesture controller and scope swipe to cards
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'<script>\s*/\* Harris mobile gesture controller v2 \*/.*?</script>'
          s2, n = re.subn(pattern, '', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Expected duplicate mobile gesture controller was not found')
          s2 = s2.replace('.swipe-guide{order:4;', '.swipe-guide{pointer-events:none;order:4;')
          s2 = s2.replace('barrel.style.touchAction = \'pan-y\';', 'barrel.style.touchAction = \'pan-y\';\n  barrel.style.overscrollBehaviorX = \'contain\';')
          if s2 == s:
              raise SystemExit('No carousel changes were made')
          p.write_text(s2, encoding='utf-8')
      - name: Verify single carousel controller
        shell: bash
        run: |
          test "$(grep -o 'Harris mobile gesture controller v2' index.html | wc -l)" -eq 0
          test "$(grep -o 'barrel.addEventListener('"'"'pointerdown'"'"'' index.html | wc -l)" -eq 1
          grep -q 'Swipe left or right Below' index.html
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply local carousel gesture rebuild' || exit 0
          git push