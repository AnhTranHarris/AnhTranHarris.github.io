name: Fix four-card carousel snapping

on:
  push:
    paths:
      - '.github/workflows/fix-carousel-four-card-snap.yml'

permissions:
  contents: write

jobs:
  fix-carousel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Align carousel snap math with four cards
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          parts = s.rsplit('</script>', 1)
          if len(parts) != 2:
              raise SystemExit('Could not find final script block; refusing to modify the site.')
          script, tail = parts
          original = script
          script = script.replace('%3', '%4')
          script = script.replace('/120', '/90')
          script = script.replace('*120', '*90')
          if script == original:
              raise SystemExit('No three-card snap math was found; refusing to create a no-op commit.')
          p.write_text(script + '</script>' + tail, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix four-card carousel snap alignment'
          git push
