name: Fix four-card carousel snapping

on:
  push:

permissions:
  contents: write

jobs:
  inspect-carousel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Inspect active carousel math
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          script=s.rsplit('<script>',1)[-1].rsplit('</script>',1)[0]
          for m in re.finditer(r'.{0,180}(?:angle|snap|round|pointer|drag|velocity|friction|120|90|%3|%4).{0,240}', script, re.I):
              print(m.group(0))
          PY
          exit 1
