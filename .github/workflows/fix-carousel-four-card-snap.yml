name: Fix four-card carousel snapping

on:
  push:

permissions:
  contents: write

jobs:
  fix-carousel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove CSS transition interference from JS motion
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = '.barrel.dragging{transition:none;cursor:grabbing}'
          new_css = old_css + '.barrel.js-motion{transition:none!important}'
          if old_css not in s:
              raise SystemExit('Carousel drag CSS marker not found; refusing to modify the site.')
          s = s.replace(old_css, new_css, 1)

          parts = s.rsplit('<script>', 1)
          if len(parts) != 2:
              raise SystemExit('Final script marker not found; refusing to modify the site.')
          head, script_tail = parts
          script, tail = script_tail.rsplit('</script>', 1)

          old = 'function animateTo(target,duration=820){stopMotion();const from=angle-diff=target-from'
          # Patch the actual compact function by replacing stable fragments.
          if 'function animateTo(target,duration=820){stopMotion();' not in script:
              raise SystemExit('animateTo marker not found; refusing to modify the site.')
          script = script.replace('function animateTo(target,duration=820){stopMotion();', 'function animateTo(target,duration=820){stopMotion();barrel.classList.add(\'js-motion\');', 1)
          script = script.replace("barrel.classList.remove('moving');motionFrame=0}}motionFrame=requestAnimationFrame(tick)}", "barrel.classList.remove('moving');barrel.classList.remove('js-motion');motionFrame=0}}motionFrame=requestAnimationFrame(tick)}", 1)

          if 'function settleFromVelocity(){stopMotion();' not in script:
              raise SystemExit('settleFromVelocity marker not found; refusing to modify the site.')
          script = script.replace('function settleFromVelocity(){stopMotion();', 'function settleFromVelocity(){stopMotion();barrel.classList.add(\'js-motion\');', 1)
          script = script.replace("barrel.classList.remove('moving');motionFrame=0}}motionFrame=requestAnimationFrame(coast)}", "barrel.classList.remove('moving');barrel.classList.remove('js-motion');motionFrame=0}}motionFrame=requestAnimationFrame(coast)}", 1)

          if 'js-motion' not in script or '.barrel.js-motion' not in s:
              raise SystemExit('Motion transition guard was not installed; refusing to commit.')
          p.write_text(head + '<script>' + script + '</script>' + tail, encoding='utf-8')
      - name: Verify carousel math and motion guard
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          checks = [
              '.barrel.js-motion{transition:none!important}' in s,
              'Math.round(-angle/90)%4' in s,
              'Math.round(angle/90)*90' in s,
              'angle+dir*90' in s,
          ]
          if not all(checks):
              raise SystemExit(f'Carousel verification failed: {checks}')
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix four-card carousel settling motion'
          git push
