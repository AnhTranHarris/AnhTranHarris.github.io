name: Apply carousel layout update

on:
  push:
    paths:
      - '.github/workflows/apply-carousel-layout.yml'

permissions:
  contents: write

jobs:
  update-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Update portfolio layout
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the top navigation links while preserving the About button.
          old_nav = '<nav class="nav"><button id="aboutBtn">About me</button><a class="btn" href="https://github.com/AnhTranHarris" target="_blank" rel="noreferrer">GitHub</a><a class="btn" href="https://www.linkedin.com/in/AnhTran-Harris/" target="_blank" rel="noreferrer">LinkedIn</a></nav>'
          new_nav = '<nav class="nav"><button id="aboutBtn">About me</button></nav>'
          if old_nav in s:
              s = s.replace(old_nav, new_nav, 1)
          else:
              s = re.sub(r'<nav class="nav">.*?</nav>', '<nav class="nav"><button id="aboutBtn">About me</button></nav>', s, count=1, flags=re.S)

          # Add a fourth carousel card for professional presence.
          marker = '</article></div><div class="controls">'
          card = '''</article><article class="page"><div class="page-top"><span class="num">04 / PROFESSIONAL PRESENCE</span><span class="state">Connect</span></div><div><h2>Find Me<br>Online</h2><p>See the work behind this portfolio, follow what I am building, and connect with me professionally.</p></div><div class="page-bottom"><span class="small">GitHub + LinkedIn</span><span style="display:flex;gap:14px;flex-wrap:wrap"><a class="repo" href="https://github.com/AnhTranHarris" target="_blank" rel="noreferrer">GitHub →</a><a class="repo" href="https://www.linkedin.com/in/AnhTran-Harris/" target="_blank" rel="noreferrer">LinkedIn →</a></span></div></article></div><div class="controls">'''
          if '04 / PROFESSIONAL PRESENCE' not in s:
              if marker not in s:
                  raise SystemExit('Carousel marker not found; refusing to modify the site.')
              s = s.replace(marker, card, 1)

          # Make the four-card barrel evenly spaced at 90-degree intervals.
          s = s.replace('rotateY(120deg) translateZ(305px)', 'rotateY(90deg) translateZ(305px)')
          s = s.replace('rotateY(240deg) translateZ(305px)', 'rotateY(180deg) translateZ(305px)')
          if 'page:nth-child(4)' not in s:
              s = s.replace('.page:nth-child(3){transform:rotateY(180deg) translateZ(305px)}', '.page:nth-child(3){transform:rotateY(180deg) translateZ(305px)}.page:nth-child(4){transform:rotateY(270deg) translateZ(305px)}', 1)

          # Mobile barrel positions use the same four-way geometry.
          s = s.replace('rotateY(120deg) translateZ(45vw)', 'rotateY(90deg) translateZ(45vw)')
          s = s.replace('rotateY(240deg) translateZ(45vw)', 'rotateY(180deg) translateZ(45vw)')
          if '@media(max-width:560px)' in s and '.page:nth-child(4){transform:rotateY(270deg) translateZ(45vw)}' not in s:
              s = s.replace('.page:nth-child(3){transform:rotateY(180deg) translateZ(45vw)}', '.page:nth-child(3){transform:rotateY(180deg) translateZ(45vw)}.page:nth-child(4){transform:rotateY(270deg) translateZ(45vw)}', 1)

          # Four cards means four carousel stops.
          s = s.replace('angle+=dir*120', 'angle+=dir*90')
          s = s.replace('dir*120', 'dir*90')
          s = s.replace('Math.round(-angle/120)', 'Math.round(-angle/90)')
          s = s.replace('===3', '===3')
          s = s.replace('dots=[...document.querySelectorAll(\'.dot\')]', 'dots=[...document.querySelectorAll(\'.dot\')]')

          # Add a fourth indicator dot if the existing three-dot markup is present.
          s = s.replace('<span class="dot"></span><span class="dot"></span></div>', '<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>', 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit layout update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Move social links into carousel' || exit 0
          git push