name: Patch repeatable mobile carousel swipes

on:
  push:

permissions:
  contents: write

jobs:
  patch-carousel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'Swipe left or right Below' not in s:
            if 'Swipe left or right' not in s: raise SystemExit('swipe marker missing')
            s=s.replace('Swipe left or right','Swipe left or right Below',1)
          if 'overscroll-behavior-x:contain' not in s:
            marker='.barrel.js-motion{transition:none!important}'
            if marker not in s: raise SystemExit('motion marker missing')
            s=s.replace(marker,marker+'.barrel{overscroll-behavior-x:contain}',1)
          parts=s.rsplit('<script>',1)
          if len(parts)!=2: raise SystemExit('script marker missing')
          head,tail=parts
          script,rest=tail.rsplit('</script>',1)
          if 'mobileSwipeCoordinatorV4' not in script:
            script += r'''
/* mobileSwipeCoordinatorV4 */
(function(){
  const g={active:false,axis:null,id:null,sx:0,sy:0,lx:0,lt:0,v:0,raf:0};
  const STEP=90,T=8;
  const cancel=()=>{if(g.raf){cancelAnimationFrame(g.raf);g.raf=0;}};
  barrel.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    cancel();g.active=true;g.axis=null;g.id=e.pointerId;g.sx=g.lx=e.clientX;g.sy=e.clientY;g.lt=performance.now();g.v=0;
  },true);
  barrel.addEventListener('pointermove',e=>{
    if(!g.active||e.pointerId!==g.id)return;
    const dx=e.clientX-g.sx,dy=e.clientY-g.sy;
    if(!g.axis){if(Math.abs(dx)<T&&Math.abs(dy)<T)return;g.axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}
    if(g.axis!=='x')return;
    e.preventDefault();e.stopImmediatePropagation();
    if(!barrel.hasPointerCapture(e.pointerId))barrel.setPointerCapture(e.pointerId);
    const now=performance.now(),dt=Math.max(8,now-g.lt),dd=e.clientX-g.lx;
    stopMotion();barrel.classList.add('js-motion','moving');angle+=dd*.62;paint();g.v=(dd*.62/dt)*.72+g.v*.28;g.lx=e.clientX;g.lt=now;
  },true);
  function settle(){
    cancel();barrel.classList.add('js-motion','moving');
    const target=Math.round(angle/STEP)*STEP,start=angle,diff=((target-start+540)%360)-180,dur=520,t0=performance.now();
    function f(now){const p=Math.min(1,(now-t0)/dur),q=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;angle=start+diff*q;paint();if(p<1)g.raf=requestAnimationFrame(f);else{angle=target;paint();barrel.classList.remove('moving','js-motion');g.raf=0;}}
    g.raf=requestAnimationFrame(f);
  }
  function coast(v){
    cancel();barrel.classList.add('js-motion','moving');let last=performance.now();
    function f(now){const dt=Math.min(32,Math.max(8,now-last));last=now;angle+=v*dt;paint();v*=Math.pow(.93,dt/16);if(Math.abs(v)<.008){settle();return;}g.raf=requestAnimationFrame(f);}
    g.raf=requestAnimationFrame(f);
  }
  function end(e,cancelled){
    if(!g.active||e.pointerId!==g.id)return;
    if(g.axis==='x'){
      e.preventDefault();e.stopImmediatePropagation();
      if(barrel.hasPointerCapture(e.pointerId))barrel.releasePointerCapture(e.pointerId);
      const v=g.v;g.active=false;g.axis=null;g.id=null;g.v=0;
      if(cancelled||Math.abs(v)<.012)settle();else coast(v);
    }else{g.active=false;g.axis=null;g.id=null;g.v=0;}
  }
  barrel.addEventListener('pointerup',e=>end(e,false),true);
  barrel.addEventListener('pointercancel',e=>end(e,true),true);
})();
'''
          p.write_text(head+'<script>'+script+'</script>'+rest,encoding='utf-8')
      - name: Verify
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=['Swipe left or right Below' in s,'overscroll-behavior-x:contain' in s,'mobileSwipeCoordinatorV4' in s,"barrel.addEventListener('pointerdown'" in s,'Math.round(angle/STEP)*STEP' in s]
          if not all(checks): raise SystemExit(str(checks))
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix repeat mobile carousel swipe navigation'
          git push
