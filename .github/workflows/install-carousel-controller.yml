name: Install isolated carousel controller
on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - '.github/workflows/install-carousel-controller.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy carousel controller and load isolated controller
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<script>\s*\(\(\) => \{.*?</script>', '<script src="carousel-touch.js"></script>', s, count=1, flags=re.S)
          s = s.replace('touch-action:pan-y;overscroll-behavior-x:none;', 'touch-action:none;overscroll-behavior-x:none;')
          s = s.replace('touch-action:pan-y}.page', 'touch-action:none}.page')
          p.write_text(s, encoding='utf-8')
      - name: Verify
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert 'carousel-touch.js' in s
          assert 'touch-action:none' in s
          assert '<script>\n(() => {' not in s
      - name: Commit site rebuild
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Rebuild carousel interaction as isolated card controller' || exit 0
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          rm .github/workflows/install-carousel-controller.yml
          git add .github/workflows/install-carousel-controller.yml
          git commit -m 'Remove one-time carousel repair workflow' || exit 0
          git push
