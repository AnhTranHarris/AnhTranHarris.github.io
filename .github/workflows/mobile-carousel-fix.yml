name: Mobile carousel fix

on:
  push:

permissions:
  contents: write

jobs:
  fix-carousel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Update mobile gesture behavior
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'Swipe left or right Below' not in s:
              s=s.replace('Swipe left or right','Swipe left or right Below',1)
          if 'overscroll-behavior-x:contain' not in s:
              s=s.replace('.barrel.js-motion{transition:none!important}', '.barrel.js-motion{transition:none!important}.barrel{overscroll-behavior-x:contain}', 1)
          parts=s.rsplit('<script>',1)
          head,tail=parts
          script,rest=tail.rsplit('</script>',1)
          if 'mobileSwipeFixFinal' not in script:
              script += r'''
/* mobileSwipeFixFinal */
(function(){
 const g={a:false,axis:null,id:null,sx:0,sy:0,lx:0,lt:0,v:0,raf:0},STEP=90,T=8;
 const stop=()=>{if(g.raf){cancelAnimationFrame(g.raf);g.raf=0;}};
 const down=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;stop();g.a=true;g.axis=null;g.id=e.pointerId;g.sx=g.lx=e.clientX;g.sy=e.clientY;g.lt=performance.now();g.v=0;};
 const move=e=>{if(!g.a||e.pointerId!==g.id)return;const dx=e.clientX-g.sx,dy=e.clientY-g.sy;if(!g.axis){if(Math.abs(dx)<T&&Math.abs(dy)<T)return;g.axis=Math.abs(dx)>Math.abs(dy)?'x':'y';}if(g.axis!=='x')return;e.preventDefault();e.stopImmediatePropagation();if(!barrel.hasPointerCapture(e.pointerId))barrel.setPointerCapture(e.pointerId);const now=performance.now(),dt=Math.max(8,now-g.lt),dd=e.clientX-g.lx;stopMotion();barrel.classList.add('js-motion','moving');angle+=dd*.62;paint();g.v=(dd*.62/dt)*.72+g.v*.28;g.lx=e.clientX;g.lt=now;};
 function settle(){stop();barrel.classList.add('js-motion','moving');const target=Math.round(angle/STEP)*STEP,start=angle,diff=((target-start+540)%360)-180,dur=520,t0=performance.now();function f(now){const p=Math.min(1,(now-t0)/dur),q=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;angle=start+diff*q;paint();if(p<1)g.raf=requestAnimationFrame(f);else{angle=target;paint();barrel.classList.remove('moving','js-motion');g.raf=0;}}g.raf=requestAnimationFrame(f);}
 function coast(v){stop();barrel.classList.add('js-motion','moving');let last=performance.now();function f(now){const dt=Math.min(32,Math.max(8,now-last));last=now;angle+=v*dt;paint();v*=Math.pow(.93,dt/16);if(Math.abs(v)<.008){settle();return;}g.raf=requestAnimationFrame(f);}g.raf=requestAnimationFrame(f);}
 const end=(e,c)=>{if(!g.a||e.pointerId!==g.id)return;if(g.axis==='x'){e.preventDefault();e.stopImmediatePropagation();if(barrel.hasPointerCapture(e.pointerId))barrel.releasePointerCapture(e.pointerId);const v=g.v;g.a=false;g.axis=null;g.id=null;g.v=0;c||Math.abs(v)<.012?settle():coast(v);}else{g.a=false;g.axis=null;g.id=null;g.v=0;}};
 barrel.addEventListener('pointerdown',down,true);barrel.addEventListener('pointermove',move,true);barrel.addEventListener('pointerup',e=>end(e,false),true);barrel.addEventListener('pointercancel',e=>end(e,true),true);
})();
'''
          p.write_text(head+'<script>'+script+'</script>'+rest,encoding='utf-8')
      - name: Verify
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=['Swipe left or right Below' in s,'overscroll-behavior-x:contain' in s,'mobileSwipeFixFinal' in s,'pointercancel' in s,'Math.round(angle/STEP)*STEP' in s]
          if not all(checks): raise SystemExit(str(checks))
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix repeat mobile carousel swipe navigation'
          git push
