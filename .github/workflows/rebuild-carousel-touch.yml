name: Rebuild carousel touch interaction
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, 'Rebuild local card swipe interaction') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace carousel gesture controller
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start='  /* Fresh carousel controller: one gesture state machine, native vertical scroll, custom horizontal drag. */'
          end='  paint();\n})();'
          a=s.find(start)
          b=s.find(end,a)
          if a<0 or b<0:
              raise SystemExit('Carousel controller boundaries not found')
          b += len(end)
          replacement=r'''  /* Rebuilt local card gesture controller: touch gestures stay on the cards. */
  barrel.style.touchAction = 'pan-y pinch-zoom';
  barrel.style.overscrollBehaviorX = 'contain';
  barrel.style.webkitUserSelect = 'none';

  let angle = 0;
  let motionFrame = 0;
  let mode = 'idle';
  let startX = 0;
  let startY = 0;
  let startAngle = 0;
  let lastX = 0;
  let lastTime = 0;
  let velocity = 0;
  let dragged = false;
  let activeTouchId = null;
  const ANGLE_PER_PIXEL = 0.68;
  const DIRECTION_THRESHOLD = 7;

  function paint(){
    barrel.style.transform = `rotateY(${angle}deg)`;
    const active = ((Math.round(-angle/90) % 4) + 4) % 4;
    dots.forEach((dot,i) => dot.classList.toggle('on', i === active));
  }
  function stopMotion(){
    if (motionFrame){ cancelAnimationFrame(motionFrame); motionFrame = 0; }
  }
  function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
  function snapToNearest(){
    stopMotion();
    const target=Math.round(angle/90)*90;
    const from=angle, diff=target-from, start=performance.now();
    barrel.classList.add('js-motion','moving');
    function frame(now){
      const p=Math.min(1,(now-start)/420);
      angle=from+diff*easeOutCubic(p);
      paint();
      if(p<1) motionFrame=requestAnimationFrame(frame);
      else { angle=target; paint(); barrel.classList.remove('js-motion','moving'); motionFrame=0; }
    }
    motionFrame=requestAnimationFrame(frame);
  }
  function coast(){
    stopMotion();
    const friction=0.92;
    const minimum=0.012;
    let previous=performance.now();
    barrel.classList.add('js-motion','moving');
    function frame(now){
      const dt=Math.min(32,Math.max(8,now-previous));
      previous=now;
      velocity*=Math.pow(friction,dt/16.667);
      angle+=velocity*dt;
      paint();
      if(Math.abs(velocity)>minimum){ motionFrame=requestAnimationFrame(frame); return; }
      snapToNearest();
    }
    motionFrame=requestAnimationFrame(frame);
  }
  function reset(){
    mode='idle';
    activeTouchId=null;
    velocity=0;
    barrel.classList.remove('dragging');
  }
  function begin(x,y){
    stopMotion();
    mode='pending';
    startX=lastX=x;
    startY=y;
    startAngle=angle;
    lastTime=performance.now();
    velocity=0;
    dragged=false;
    barrel.classList.remove('js-motion','moving');
  }
  function move(x,y,prevent){
    const dx=x-startX, dy=y-startY;
    if(mode==='pending'){
      if(Math.abs(dx)<DIRECTION_THRESHOLD && Math.abs(dy)<DIRECTION_THRESHOLD) return false;
      if(Math.abs(dy)>Math.abs(dx)){ reset(); return false; }
      mode='horizontal';
      dragged=true;
      barrel.classList.add('dragging','js-motion');
    }
    if(mode!=='horizontal') return false;
    if(prevent) prevent();
    const now=performance.now();
    const dt=Math.max(8,now-lastTime);
    const next=startAngle+dx*ANGLE_PER_PIXEL;
    velocity=(next-angle)/dt;
    angle=next;
    lastX=x;
    lastTime=now;
    paint();
    return true;
  }
  function finish(){
    if(mode!=='horizontal'){ reset(); return; }
    mode='idle';
    barrel.classList.remove('dragging');
    coast();
  }

  /* Touch: local to the barrel/cards. Vertical movement is left to the page; horizontal movement is consumed here. */
  barrel.addEventListener('touchstart',e=>{
    if(e.touches.length!==1) return;
    const t=e.changedTouches[0];
    activeTouchId=t.identifier;
    begin(t.clientX,t.clientY);
  },{passive:true});

  barrel.addEventListener('touchmove',e=>{
    if(activeTouchId===null) return;
    let t=null;
    for(const touch of e.changedTouches){ if(touch.identifier===activeTouchId){t=touch;break;} }
    if(!t) return;
    move(t.clientX,t.clientY,()=>e.preventDefault());
  },{passive:false});

  barrel.addEventListener('touchend',e=>{
    if(activeTouchId===null) return;
    for(const t of e.changedTouches){
      if(t.identifier===activeTouchId){ activeTouchId=null; finish(); break; }
    }
  },{passive:true});

  barrel.addEventListener('touchcancel',()=>{
    activeTouchId=null;
    reset();
  },{passive:true});

  /* Mouse/pen: pointer events keep desktop dragging responsive. */
  let pointerId=null;
  barrel.addEventListener('pointerdown',e=>{
    if(e.pointerType==='touch') return;
    if(e.pointerType==='mouse' && e.button!==0) return;
    pointerId=e.pointerId;
    begin(e.clientX,e.clientY);
    try{barrel.setPointerCapture(pointerId);}catch(_){ }
  },{passive:true});
  barrel.addEventListener('pointermove',e=>{
    if(e.pointerType==='touch' || e.pointerId!==pointerId) return;
    move(e.clientX,e.clientY,()=>e.preventDefault());
  },{passive:false});
  barrel.addEventListener('pointerup',e=>{
    if(e.pointerId!==pointerId) return;
    pointerId=null;
    try{if(barrel.hasPointerCapture(e.pointerId)) barrel.releasePointerCapture(e.pointerId);}catch(_){ }
    finish();
  });
  barrel.addEventListener('pointercancel',e=>{
    if(e.pointerId!==pointerId) return;
    pointerId=null;
    reset();
  });

  document.addEventListener('click',e=>{
    if(dragged){e.preventDefault();e.stopPropagation();dragged=false;}
  },true);

  document.getElementById('next')?.addEventListener('click',()=>animateStep(-1));
  document.getElementById('prev')?.addEventListener('click',()=>animateStep(1));
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight') animateStep(-1);
    if(e.key==='ArrowLeft') animateStep(1);
    if(e.key==='Escape') closeAbout();
  });

  paint();
})();'''
          s2=s[:a]+replacement+s[b:]
          p.write_text(s2,encoding='utf-8')
      - name: Verify rebuilt controller
        shell: bash
        run: |
          grep -q "Rebuilt local card gesture controller" index.html
          grep -q "touchstart" index.html
          grep -q "touchmove" index.html
          grep -q "touchend" index.html
          grep -q "ANGLE_PER_PIXEL = 0.68" index.html
          grep -q "Swipe left or right Below" index.html
      - name: Commit rebuild
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Rebuild local card swipe interaction'
          git push
