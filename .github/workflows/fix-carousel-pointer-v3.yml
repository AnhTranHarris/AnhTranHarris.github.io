name: Fix carousel pointer handling v3
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Fix mobile carousel pointer handling v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace gesture handlers with document-level lifecycle
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pattern=r"let activePointerId=null;.*?barrel\.addEventListener\('lostpointercapture',e=>\{.*?\}\);"
          replacement="""let activePointerId=null,gestureMode='idle';
          barrel.addEventListener('pointerdown',e=>{
            if(e.target.closest('a')) return;
            stopMotion();
            activePointerId=e.pointerId;
            gestureMode='pending';
            startX=e.clientX; startY=e.clientY;
            startAngle=angle; lastX=e.clientX; lastTime=performance.now(); velocity=0;
            barrel.classList.remove('js-motion','dragging');
          });
          document.addEventListener('pointermove',e=>{
            if(activePointerId!==e.pointerId) return;
            const dx=e.clientX-startX,dy=e.clientY-startY;
            if(gestureMode==='pending'){
              if(Math.abs(dx)<8&&Math.abs(dy)<8) return;
              if(Math.abs(dy)>Math.abs(dx)){
                gestureMode='vertical';
                activePointerId=null;
                velocity=0;
                return;
              }
              gestureMode='horizontal';
              barrel.classList.add('dragging','moving');
            }
            if(gestureMode!=='horizontal') return;
            e.preventDefault();
            const now=performance.now(),moveX=e.clientX-lastX,dt=Math.max(8,now-lastTime);
            const sampleVelocity=(moveX/dt)*0.42;
            velocity=velocity*0.72+sampleVelocity*0.28;
            angle=startAngle+(e.clientX-startX)*0.42;
            paint();
            lastX=e.clientX; lastTime=now;
          },{passive:false});
          function finishPointer(e){
            if(activePointerId!==e.pointerId) return;
            const wasHorizontal=gestureMode==='horizontal';
            activePointerId=null;
            gestureMode='idle';
            barrel.classList.remove('dragging');
            if(wasHorizontal) settleFromVelocity(); else velocity=0;
          }
          document.addEventListener('pointerup',finishPointer);
          document.addEventListener('pointercancel',finishPointer);
          window.addEventListener('blur',()=>{
            if(activePointerId!==null){activePointerId=null;gestureMode='idle';velocity=0;barrel.classList.remove('dragging');}
          });"""
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Expected gesture block not found; refusing to modify site.')
          p.write_text(s2,encoding='utf-8')
      - name: Verify
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for x in ['gestureMode=\'idle\'','document.addEventListener(\'pointermove\'','document.addEventListener(\'pointerup\'','document.addEventListener(\'pointercancel\'','touch-action:pan-y','settleFromVelocity']:
              assert x in s, x
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix mobile carousel pointer handling v3'
          git push