name: Fix carousel touch interaction
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Fix carousel touch interaction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace gesture handler
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          pattern=r"let activePointerId=null;.*?barrel\.addEventListener\('lostpointercapture',e=>\{.*?\}\);"
          replacement="""let activePointerId=null; let horizontalGesture=false; let dragging=false; let startX=0,startY=0,startAngle=0,lastX=0,lastTime=0,velocity=0;\n          function endGesture(){activePointerId=null;horizontalGesture=false;dragging=false;barrel.classList.remove('dragging','moving','js-motion');velocity=0;}\n          barrel.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;if(e.target.closest('a'))return;stopMotion();endGesture();activePointerId=e.pointerId;startX=lastX=e.clientX;startY=e.clientY;startAngle=angle;lastTime=performance.now();velocity=0;barrel.classList.add('js-motion');},{passive:true});\n          barrel.addEventListener('pointermove',e=>{if(activePointerId!==e.pointerId)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(!horizontalGesture){if(Math.abs(dx)<10&&Math.abs(dy)<10)return;if(Math.abs(dy)>=Math.abs(dx)){endGesture();return;}horizontalGesture=true;dragging=true;barrel.classList.add('dragging','moving');try{barrel.setPointerCapture(e.pointerId)}catch(_){} }if(!horizontalGesture)return;e.preventDefault();const now=performance.now(),dt=Math.max(8,now-lastTime),mx=e.clientX-lastX;velocity=velocity*.8+(mx/dt)*.2;angle=startAngle+(e.clientX-startX)*.42;paint();lastX=e.clientX;lastTime=now;},{passive:false});\n          function finishGesture(e){if(activePointerId!==e.pointerId)return;const shouldSettle=horizontalGesture;try{if(barrel.hasPointerCapture?.(e.pointerId))barrel.releasePointerCapture(e.pointerId)}catch(_){}activePointerId=null;horizontalGesture=false;dragging=false;barrel.classList.remove('dragging');if(shouldSettle){settleFromVelocity();}else{velocity=0;barrel.classList.remove('moving','js-motion');}}\n          barrel.addEventListener('pointerup',finishGesture);\n          barrel.addEventListener('pointercancel',finishGesture);\n          barrel.addEventListener('lostpointercapture',e=>{if(activePointerId!==e.pointerId)return;const shouldSettle=horizontalGesture;activePointerId=null;horizontalGesture=false;dragging=false;barrel.classList.remove('dragging');if(shouldSettle)settleFromVelocity();else{velocity=0;barrel.classList.remove('moving','js-motion');}});"""
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Current gesture block not found; refusing to modify site.')
          p.write_text(s2,encoding='utf-8')
      - name: Verify
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for x in ['activePointerId=null','pointerdown','pointermove','pointerup','pointercancel','setPointerCapture','releasePointerCapture','touch-action:pan-y']:
              assert x in s,x
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix carousel touch interaction'
          git push