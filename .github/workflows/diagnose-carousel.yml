name: Carousel repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Rebuild local card swipe interaction') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild local card swipe interaction
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start='  /* Fresh carousel controller: one gesture state machine, native vertical scroll, custom horizontal drag. */'
          end='  paint();\n})();'
          a=s.find(start)
          b=s.find(end,a)
          if a<0 or b<0: raise SystemExit('carousel controller boundaries not found')
          b += len(end)
          replacement=r'''  /* Rebuilt local card gesture controller: touch gestures stay on the cards. */
  barrel.style.touchAction='pan-y pinch-zoom';
  barrel.style.overscrollBehaviorX='contain';
  barrel.style.webkitUserSelect='none';
  let angle=0,motionFrame=0,mode='idle',startX=0,startY=0,startAngle=0,lastTime=0,velocity=0,dragged=false,activeTouchId=null,pointerId=null;
  const ANGLE_PER_PIXEL=0.68,DIRECTION_THRESHOLD=7;
  function paint(){barrel.style.transform=`rotateY(${angle}deg)`;const active=((Math.round(-angle/90)%4)+4)%4;dots.forEach((dot,i)=>dot.classList.toggle('on',i===active));}
  function stopMotion(){if(motionFrame){cancelAnimationFrame(motionFrame);motionFrame=0;}}
  function easeOutCubic(t){return 1-Math.pow(1-t,3);}
  function snapToNearest(){stopMotion();const target=Math.round(angle/90)*90,from=angle,diff=target-from,start=performance.now();barrel.classList.add('js-motion','moving');function frame(now){const p=Math.min(1,(now-start)/420);angle=from+diff*easeOutCubic(p);paint();if(p<1)motionFrame=requestAnimationFrame(frame);else{angle=target;paint();barrel.classList.remove('js-motion','moving');motionFrame=0;}}motionFrame=requestAnimationFrame(frame);}
  function coast(){stopMotion();const friction=.92,minimum=.012;let previous=performance.now();barrel.classList.add('js-motion','moving');function frame(now){const dt=Math.min(32,Math.max(8,now-previous));previous=now;velocity*=Math.pow(friction,dt/16.667);angle+=velocity*dt;paint();if(Math.abs(velocity)>minimum){motionFrame=requestAnimationFrame(frame);return;}snapToNearest();}motionFrame=requestAnimationFrame(frame);}
  function reset(){mode='idle';activeTouchId=null;pointerId=null;velocity=0;barrel.classList.remove('dragging');}
  function begin(x,y){stopMotion();mode='pending';startX=x;startY=y;startAngle=angle;lastTime=performance.now();velocity=0;dragged=false;barrel.classList.remove('js-motion','moving');}
  function move(x,y,prevent){const dx=x-startX,dy=y-startY;if(mode==='pending'){if(Math.abs(dx)<DIRECTION_THRESHOLD&&Math.abs(dy)<DIRECTION_THRESHOLD)return;if(Math.abs(dy)>Math.abs(dx)){reset();return;}mode='horizontal';dragged=true;barrel.classList.add('dragging','js-motion');}if(mode!=='horizontal')return;prevent?.();const now=performance.now(),dt=Math.max(8,now-lastTime),next=startAngle+dx*ANGLE_PER_PIXEL;velocity=(next-angle)/dt;angle=next;lastTime=now;paint();}
  function finish(){if(mode!=='horizontal'){reset();return;}mode='idle';barrel.classList.remove('dragging');coast();}
  barrel.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const t=e.changedTouches[0];activeTouchId=t.identifier;begin(t.clientX,t.clientY);},{passive:true});
  barrel.addEventListener('touchmove',e=>{if(activeTouchId===null)return;for(const t of e.changedTouches){if(t.identifier===activeTouchId){move(t.clientX,t.clientY,()=>e.preventDefault());break;}}},{passive:false});
  barrel.addEventListener('touchend',e=>{if(activeTouchId===null)return;for(const t of e.changedTouches){if(t.identifier===activeTouchId){activeTouchId=null;finish();break;}}},{passive:true});
  barrel.addEventListener('touchcancel',()=>reset(),{passive:true});
  barrel.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||(e.pointerType==='mouse'&&e.button!==0))return;pointerId=e.pointerId;begin(e.clientX,e.clientY);try{barrel.setPointerCapture(pointerId);}catch(_){ }},{passive:true});
  barrel.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||e.pointerId!==pointerId)return;move(e.clientX,e.clientY,()=>e.preventDefault());},{passive:false});
  barrel.addEventListener('pointerup',e=>{if(e.pointerId!==pointerId)return;try{if(barrel.hasPointerCapture(e.pointerId))barrel.releasePointerCapture(e.pointerId);}catch(_){ }pointerId=null;finish();});
  barrel.addEventListener('pointercancel',e=>{if(e.pointerId===pointerId)reset();});
  document.addEventListener('click',e=>{if(dragged){e.preventDefault();e.stopPropagation();dragged=false;}},true);
  document.getElementById('next')?.addEventListener('click',()=>animateStep(-1));
  document.getElementById('prev')?.addEventListener('click',()=>animateStep(1));
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')animateStep(-1);if(e.key==='ArrowLeft')animateStep(1);if(e.key==='Escape')closeAbout();});
  paint();
})();'''
          p.write_text(s[:a]+replacement+s[b:],encoding='utf-8')
      - name: Verify
        run: |
          grep -q 'Rebuilt local card gesture controller' index.html
          grep -q 'touchstart' index.html
          grep -q 'touchmove' index.html
          grep -q 'ANGLE_PER_PIXEL=0.68' index.html
          grep -q 'Swipe left or right Below' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Rebuild local card swipe interaction'
          git push
